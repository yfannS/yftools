version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=md2html
      - MYSQL_USER=md2html
      - MYSQL_PASSWORD=md2html_pass
      - JWT_SECRET=change-me-in-production
      - GIN_MODE=release
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=md2html
      - MYSQL_USER=md2html
      - MYSQL_PASSWORD=md2html_pass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./webapp
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
