version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/configs/config.yaml:/app/configs/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./webapp
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
